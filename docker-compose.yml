version: '3.8'

services:
  redis:
    image: redis:7.2-alpine
    container_name: redis-chat
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_chat_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  chat-app:
    build: .
    container_name: simple-chat-app
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SPRING_PROFILES_ACTIVE=default
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis_chat_data:
    driver: local

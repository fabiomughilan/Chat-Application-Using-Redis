spring.application.name=simple-chat-app

# Redis Configuration
server.port=${PORT:8080}

# Prefer REDIS_URL (rediss://...). Upstash REST URL+token are mapped to Redis TLS automatically.
spring.data.redis.url=${REDIS_URL:}
spring.data.redis.timeout=10s
spring.data.redis.jedis.pool.enabled=false
# Jackson JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'
spring.jackson.time-zone=UTC

# Logging
logging.level.com.freightfox.chatapp=INFO
logging.level.org.springframework.data.redis=INFO
